<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital | Empresa 1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primario: #e67e22; /* Color naranja/gastronómico */
            --fondo: #ffffff;
            --texto: #2c3e50;
            --gris-suave: #f8f9fa;
        }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--gris-suave); 
            color: var(--texto); 
            margin: 0; 
            line-height: 1.6;
        }
        header { 
            background: #1a1a1a; 
            color: white; 
            padding: 3rem 1rem; 
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { margin: 0; letter-spacing: 2px; font-size: 2.2rem; }
        .sub-header { color: var(--primario); font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }
        
        .container { 
            max-width: 600px; 
            margin: -30px auto 50px; 
            padding: 0 15px;
        }
        
        .menu-item { 
            background: white; 
            padding: 1.5rem; 
            margin-bottom: 1rem; 
            border-radius: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .menu-item:hover { transform: translateY(-3px); }

        .info { flex: 1; padding-right: 20px; }
        .info h3 { margin: 0 0 8px 0; font-size: 1.2rem; color: #1a1a1a; }
        .info p { margin: 0; color: #7f8c8d; font-size: 0.95rem; }
        
        .precio { 
            font-weight: 800; 
            font-size: 1.1rem; 
            color: var(--primario); 
            background: rgba(230, 126, 34, 0.1);
            padding: 8px 12px;
            border-radius: 10px;
            white-space: nowrap;
        }

        #loader { text-align: center; padding: 50px; font-size: 1.2rem; }
        footer { text-align: center; padding: 20px; font-size: 0.8rem; color: #bdc3c7; }
    </style>
</head>
<body>

<header>
    <p class="sub-header">Bienvenidos</p>
    <h1>NUESTRO MENÚ</h1>
</header>

<div class="container">
    <div id="loader">Consultando la cocina...</div>
    <div id="menu-contenedor"></div>
</div>

<footer>
    &copy; 2024 Menú Inteligente - Actualizado vía Google Sheets
</footer>

<script>
    // Tu URL proporcionada
    const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLnIUyLj1kUXghzd-2MbQjeKLbSv5tCGe7mGgTrn9Z2i8TsHgiCRCOWtiAPJ2eqn4d_J2P5tVLz-eb/pub?gid=0&single=true&output=csv';

    function cargarMenu() {
        Papa.parse(URL_CSV, {
            download: true,
            header: true, // Usa la primera fila como nombres de columna
            skipEmptyLines: true,
            complete: function(results) {
                const items = results.data;
                const contenedor = document.getElementById('menu-contenedor');
                let html = '';

                items.forEach(item => {
                    // Accedemos usando los nombres exactos de tu Excel: Producto, Precio, Descripción
                    const nombre = item['Producto'] || 'Sin nombre';
                    const precio = item['Precio'] || '0';
                    const desc = item['Descripción'] || '';

                    html += `
                        <div class="menu-item">
                            <div class="info">
                                <h3>${nombre}</h3>
                                <p>${desc}</p>
                            </div>
                            <div class="precio">$${precio}</div>
                        </div>
                    `;
                });

                document.getElementById('loader').style.display = 'none';
                contenedor.innerHTML = html;
            },
            error: function() {
                document.getElementById('loader').innerHTML = "Hubo un error al cargar el menú.";
            }
        });
    }

    // Ejecutar al cargar la página
    window.onload = cargarMenu;
</script>

</body>
</html>

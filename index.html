<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital | Empresa 1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --accent: #25d366; --dark: #1a1a1a; --bg: #f4f4f9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; color: #333; }
        
        header { background: var(--dark); color: white; padding: 30px 10px; text-align: center; }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 1px; }

        /* Filtros */
        .filter-container { position: sticky; top: 0; background: white; z-index: 100; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 10px; overflow-x: auto; justify-content: center; }
        .filter-btn { border: 1px solid #ddd; padding: 8px 20px; border-radius: 20px; background: white; cursor: pointer; font-weight: 600; white-space: nowrap; transition: 0.3s; }
        .filter-btn.active { background: var(--dark); color: white; border-color: var(--dark); }

        /* Grid de Productos */
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px; max-width: 1000px; margin: auto; }
        
        /* Tarjetas */
        .card { background: white; border-radius: 15px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .card img { width: 100%; height: 160px; object-fit: cover; background: #fafafa; }
        .card-body { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-body h3 { margin: 0; font-size: 1.1rem; color: #111; }
        .card-body p { font-size: 0.85rem; color: #777; margin: 8px 0; flex-grow: 1; line-height: 1.3; }
        .price { font-size: 1.2rem; font-weight: 700; color: var(--dark); margin-bottom: 12px; }

        /* Botón WhatsApp */
        .btn-ws { background: var(--accent); color: white; text-align: center; padding: 10px; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 0.85rem; transition: 0.3s; }
        .btn-ws:hover { transform: scale(1.02); filter: brightness(1.1); }

        #loader { text-align: center; padding: 50px; font-weight: bold; color: #999; }
    </style>
</head>
<body>

<header>
    <h1>MI CATÁLOGO DIGITAL</h1>
</header>

<div class="filter-container" id="filter-bar">
    </div>

<div class="container" id="grid">
    <div id="loader">Cargando productos...</div>
</div>

<script>
    const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLnIUyLj1kUXghzd-2MbQjeKLbSv5tCGe7mGgTrn9Z2i8TsHgiCRCOWtiAPJ2eqn4d_J2P5tVLz-eb/pub?gid=0&single=true&output=csv';

    let allProducts = [];

    function init() {
        Papa.parse(URL_CSV, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                allProducts = results.data;
                renderFilters();
                renderGallery(allProducts);
                document.getElementById('loader').style.display = 'none';
            },
            error: function() {
                document.getElementById('loader').innerHTML = "Error al conectar con el catálogo.";
            }
        });
    }

    function renderFilters() {
        // Extrae categorías únicas de la columna "Categoria"
        const categories = ['Todos', ...new Set(allProducts.map(p => p.Categoria).filter(c => c))];
        const bar = document.getElementById('filter-bar');
        
        bar.innerHTML = categories.map(cat => `
            <button class="filter-btn ${cat === 'Todos' ? 'active' : ''}" onclick="filterItems('${cat}', this)">
                ${cat}
            </button>
        `).join('');
    }

    function renderGallery(data) {
        const grid = document.getElementById('grid');
        grid.innerHTML = data.map(item => {
            // Prepara el mensaje de WhatsApp
            const mensaje = encodeURIComponent(`¡Hola! Me interesa el producto: ${item.Producto} ($${item.Precio})`);
            const linkWs = `https://wa.me/${item.WhatsApp}?text=${mensaje}`;
            
            return `
                <div class="card">
                    ${item.Imagen ? `<img src="${item.Imagen}" alt="${item.Producto}">` : '<div style="height:160px; background:#eee"></div>'}
                    <div class="card-body">
                        <h3>${item.Producto || 'Sin nombre'}</h3>
                        <p>${item.Descripcion || ''}</p>
                        <div class="price">$${item.Precio || '0'}</div>
                        <a href="${linkWs}" target="_blank" class="btn-ws">PEDIR POR WHATSAPP</a>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterItems(category, btn) {
        // Estética de botones
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Filtrado real
        const filtered = (category === 'Todos') 
            ? allProducts 
            : allProducts.filter(p => p.Categoria === category);
        
        renderGallery(filtered);
    }

    window.onload = init;
</script>

</body>
</html>
